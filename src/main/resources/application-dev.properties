spring.application.name=game-manager
server.port=8081

# MySQL Configuration (for local development, use localhost instead of mysql hostname)
# Change 'mysql:3306' to 'localhost:3306' when running outside Docker
spring.datasource.url=jdbc:mysql://localhost:3306/bootdb
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=INFO
logging.level.com.gamemanager=DEBUG
