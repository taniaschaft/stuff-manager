
services:
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bootdb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    
    # Don`t need since won`t be accessing the db outside the docker network
    ports:
      - "3306:3306"
    # Without it, all your database data would be lost when the container stops.
    #TODO- remove before final version is pushed
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - inatel
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  game-manager:
    build: .
    container_name: game-manager
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - inatel
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bootdb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      PUBLISHER_MANAGER_URL: http://publisher-manager:8081/publisher

  publisher-manager:
    image: taniaschaft/accessing-data-mysql:latest
    container_name: accessing-data-mysql
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
        - inatel
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bootdb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password

volumes:
  mysql_data:

networks:
  inatel:
    driver: bridge
